{% set name = "bed-reader" %}
{% set version = "1.0.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/fastlmm/bed-reader/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 1442e7ae2a1581a99622cbbe57b9c02b91e1cb1b6231fe0c47eb97805e66c2d0

build:
  number: 0
  skip: true  # [py<310]

requirements:
  build:
    - {{ stdlib("c") }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - maturin >=1.5,<2.0                     # [build_platform != target_platform]

  host:
    - python
    - pip
    - maturin >=1.5,<2.0
    - numpy

  run:
    - python
    # Versions taken from pyproject.toml
    - numpy >=1.13.3
    - pooch >=1.5.0
    # Note: leaving out scipy for 1.0 as it's only used in one optional feature.
    # May be included as a default dependency in future releases.
    # - scipy >=1.4

test:
  imports:
    - bed_reader

about:
  home: https://github.com/fastlmm/bed-reader
  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSE.md
    - THIRDPARTY.yml
  summary: Read and write the PLINK BED format, simply and efficiently.
  doc_url: https://fastlmm.github.io/bed-reader/
  dev_url: https://github.com/fastlmm/bed-reader

extra:
  recipe-maintainers:
    - jpfeuffer
    - jeromekelleher
    - CarlKCarlK
